<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inducción - Terminal de Transportes de Neiva</title>

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Lora:wght@600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --verde: #00a86b;
      --azul: #0077c8;
      --naranja: #ff7f11;
      --negro: #0a0a0a;
      --texto: #ffffff;
      --transicion: all 0.3s ease;

      /* Tipografía más pequeña y limpia */
      --h1: clamp(1.6rem, 4vw, 2.6rem);
      --h2: clamp(1.3rem, 3.2vw, 2rem);
      --p: clamp(0.85rem, 1.9vw, 1.05rem);
      --btn: clamp(0.9rem, 2.2vw, 1.05rem);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--negro);
      font-family: "Outfit", sans-serif;
      color: var(--texto);
      overflow-x: hidden;
    }

    /* Partículas */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      animation: float linear infinite;
    }
    @keyframes float {
      0% {
        opacity: 0;
        transform: translateY(0);
      }
      15% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-120vh);
      }
    }

    /* Hero */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("images/foto_terminal.png") center/cover no-repeat;
      filter: brightness(0.38);
      z-index: 0;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(0, 168, 107, 0.35),
        rgba(0, 119, 200, 0.35),
        rgba(255, 127, 17, 0.3)
      );
      mix-blend-mode: overlay;
      z-index: 1;
    }

    .contenido {
      position: relative;
      z-index: 2;
      max-width: 720px;
      padding: 20px;
    }

    .logo-terminal {
      width: clamp(100px, 20vw, 160px);
      margin-bottom: 22px;
      background: rgba(255, 255, 255, 0.55);
      padding: clamp(8px, 1.8vw, 14px);
      border-radius: 16px;
      backdrop-filter: blur(9px);
      border: 1.5px solid rgba(255, 255, 255, 1);
      animation: floatLogo 3s ease-in-out infinite;
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-size: var(--h1);
      font-weight: 800;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.6);
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeIn 0.6s forwards; opacity: 0;
    }

    .contenido-texto {
      font-size: var(--p);
      line-height: 1.65;
      opacity: 0;
      margin-bottom: 32px;
      animation: fadeIn 0.6s forwards; opacity: 0;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
      to {
        opacity: 1;
        transform: translateY(0);
      }

    /* Botón */
    .btn {
      display: inline-block;
      padding: 14px 34px;
      font-size: var(--btn);
      font-weight: 700;
      text-decoration: none;
      border-radius: 14px;
      color: #ffffff;
      background: linear-gradient(135deg, #00a86b, #0077c8);
      border: none;
      position: relative;
      overflow: hidden;
      transition: all 0.35s ease;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      opacity: 0;
      animation: fadeIn 0.6s forwards;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.45);
      background: linear-gradient(135deg, #00c47a, #0093f1);
    }

    @media (max-width: 480px) {
      .contenido-texto {
        text-align: left;
      }
      .btn {
        width: 100%;
        padding: 14px;
      }
    }
  .btn-induccion {
      display: inline-block;
      padding: 12px 28px;
      background: #ffffff0a;
      backdrop-filter: blur(12px);
      color: #4f46e5;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
      border: 2px solid rgba(79,70,229,0.4);
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      transition: all 0.25s ease;
      font-size: 1rem;
      letter-spacing: 0.2px;
    }

    .btn-induccion:hover {
      background: #4f46e5;
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(79,70,229,0.3);
      border-color: #4f46e5;
    }

    .btn-induccion:active {
      transform: scale(0.97);
      box-shadow: 0 4px 10px rgba(79,70,229,0.25);
    }
</style>
</head>
<body>
  <div class="particles">
    <div class="particle" style="width:6px;height:6px;left:20%;top:100%;animation-duration:24s"></div>
    <div class="particle" style="width:9px;height:9px;left:50%;top:95%;animation-duration:30s"></div>
    <div class="particle" style="width:5px;height:5px;left:75%;top:100%;animation-duration:28s"></div>
  </div>

  <section class="hero">
    <div class="contenido">
      <img src="logos/logo_terminal.png" alt="Logo Terminal" class="logo-terminal" />

      <h1>Bienvenido al Terminal de Transportes de Neiva</h1>
      <h2 class="subtitulo">Proceso de Inducción</h2>

      <p class="contenido-texto">
        Conoce nuestros procesos internos, normas de seguridad y cultura corporativa.
        Avanza paso a paso y obtén tu certificado de finalización.
      </p>

      <a href="modulos.html" class="btn">Iniciar Inducción</a>
    </div>
  </section>
</body>
</html>
